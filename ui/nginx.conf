# Rendered at container start by the nginx image's envsubst step (/etc/nginx/templates).
# Upstreams are looked up per request through the container's own DNS resolver, so a restarted
# Core or DPS container (new IP) is picked up without restarting the UI.
server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 60m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Same-origin only. Mantine sets inline styles; the document viewer shows PDFs from blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ { set $core ${CORE_UPSTREAM}; proxy_pass $core; proxy_set_header Host $host; }
    location /dps/ { set $dps ${DPS_UPSTREAM}; proxy_pass $dps; proxy_set_header Host $host; proxy_read_timeout 120s; }
    location / { try_files $uri /index.html; }
}
