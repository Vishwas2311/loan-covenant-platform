# Rendered at container start by the nginx image's envsubst step (/etc/nginx/templates).
# Upstreams are looked up per request through the container's own DNS resolver, so a restarted
# Core or DPS container (new IP) is picked up without restarting the UI.

# One id per user request, passed to Core and DPS so their log lines can be joined (kept when the
# caller already sent one).
map $http_x_correlation_id $correlation_id {
    "" $request_id;
    default $http_x_correlation_id;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 60m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin only, plus the identity provider (OIDC_ORIGIN) for sign-in discovery and token calls.
    # Mantine sets inline styles; the document viewer shows PDFs from blob: URLs.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' ${OIDC_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # A location that sets its own add_header drops these server-level ones, so each such location
    # below repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy $csp always;

    # Sign-in settings for the browser (src/auth/oidc.ts). An empty authority keeps the development
    # "Act as" picker. Not secret: a public client has no secret.
    location = /auth-config.json {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        return 200 '{"authority":"${OIDC_AUTHORITY}","clientId":"${OIDC_CLIENT_ID}","scope":"${OIDC_SCOPE}"}';
    }

    # Vite puts a content hash in every asset name, so assets are cached for a year; the page itself is
    # revalidated on each load, so users get a new release at once.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    location /api/ {
        set $core ${CORE_UPSTREAM};
        proxy_pass $core;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /dps/ {
        set $dps ${DPS_UPSTREAM};
        proxy_pass $dps;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        try_files $uri /index.html;
    }
}
