<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden-set review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #d9dde5;
    --accent: #1c64d8; --ok: #18794e; --warn: #b54708; --bad: #c4320a; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
            --accent: #6ea2ff; --ok: #4cc38a; --warn: #f0a44b; --bad: #ff7a59; --chip: #232a35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .spacer { flex: 1; }
  label.inline { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  textarea { width: 100%; resize: vertical; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 230px 1fr 520px; height: calc(100vh - 53px); }
  nav { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  nav button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 12px; }
  nav button.active { background: var(--chip); }
  nav small { display: block; color: var(--muted); }
  .status { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); }
  .status.VERIFIED { color: var(--ok); } .status.IN_REVIEW { color: var(--warn); } .status.DRAFT_UNVERIFIED { color: var(--muted); }
  iframe { width: 100%; height: 100%; border: 0; background: #888; }
  section.editor { overflow: auto; padding: 12px; border-left: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .card.checked { border-color: var(--ok); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 6px; }
  .row > label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .row input.num { width: 90px; } .row input.page { width: 60px; }
  .quote-state { font-size: 12px; } .quote-state.yes { color: var(--ok); } .quote-state.no { color: var(--bad); }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg { color: var(--muted); } .msg.error { color: var(--bad); } .msg.ok { color: var(--ok); }
  .help { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } iframe { height: 70vh; } }
</style>
</head>
<body>
<header>
  <h1>Golden-set review</h1>
  <span class="msg" id="progress"></span>
  <span class="spacer"></span>
  <label class="inline">Your name <input id="reviewer" autocomplete="name" placeholder="e.g. Priya Shah"></label>
</header>
<main>
  <nav id="docs" aria-label="Agreements"></nav>
  <iframe id="pdf" title="Agreement"></iframe>
  <section class="editor" aria-label="Covenants">
    <p class="help">For each covenant: compare it with the agreement, fix any field, then tick <b>Correct</b>.
      Remove entries that are not covenants and add any that are missing. When every entry is ticked,
      <b>Mark verified</b>.</p>
    <div id="covenants"></div>
    <button id="add">+ Add a missing covenant</button>
    <div class="card" style="margin-top:10px">
      <label>Notes (step-downs, cure periods, testing basis)
        <textarea id="notes" rows="3"></textarea></label>
    </div>
    <div class="bar">
      <button id="save">Save draft</button>
      <button id="verify" class="primary">Mark verified</button>
      <span class="msg" id="msg" role="status"></span>
    </div>
  </section>
</main>
<datalist id="metrics">
  <option>DSCR</option><option>ICR</option><option>DEBT_TO_EBITDA</option><option>NET_DEBT_TO_EBITDA</option>
  <option>DEBT_TO_EQUITY</option><option>CURRENT_RATIO</option><option>TANGIBLE_NET_WORTH</option>
  <option>LEVERAGE</option><option>FIXED_CHARGE_COVER</option><option>NEGATIVE_PLEDGE</option>
  <option>CHANGE_OF_CONTROL</option><option>INSURANCE</option><option>FINANCIAL_STATEMENTS_DELIVERY</option>
</datalist>
<script src="/review.js"></script>
</body>
</html>
