# Runs the three test gates and builds the Docker images on every push and pull request.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests, integration tests and coverage
        run: mvn -B -P no-owasp clean verify
      - name: SpotBugs
        run: mvn -B -P no-owasp compile spotbugs:check

  dps:
    name: DPS (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests and coverage
        run: pytest
      - name: Golden-set evaluator and review tool
        run: pytest ../golden-set -q
      # Extraction regression gate: DPS's own parser and extractors over the synthetic golden set, whose
      # labels are written from the same specification as the documents. The analyst-verified labels become
      # the release gate as they are completed (--statuses VERIFIED).
      - name: Golden-set extraction gate (synthetic)
        run: |
          python ../golden-set/predict.py --out ../golden-predictions
          python ../golden-set/evaluate.py --predictions ../golden-predictions --statuses SYNTHETIC

  # Production DPS runs on SQL Server; SQLite hides dialect bugs (it accepted "IS 0" for a boolean).
  dps-sqlserver:
    name: DPS on SQL Server
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P Ci-only-Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: dps
    env:
      DPS_TEST_DATABASE_URL: mssql+pymssql://sa:Ci-only-Passw0rd@localhost:1433/dps_test
      DPS_DATABASE_URL: mssql+pymssql://sa:Ci-only-Passw0rd@localhost:1433/dps_migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,mssql]"
      - name: Create databases
        run: |
          python - <<'EOF'
          import pymssql
          conn = pymssql.connect("localhost", "sa", "Ci-only-Passw0rd", autocommit=True)
          for name in ("dps_test", "dps_migrations"):
              conn.cursor().execute(f"CREATE DATABASE {name}; ALTER DATABASE {name} SET READ_COMMITTED_SNAPSHOT ON")
          EOF
      - name: Migrations, and no drift from the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest --no-cov

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Type check and build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [core, dps, ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
      # The 4 GB heavy worker image is not built here.
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build core dps-api ui
