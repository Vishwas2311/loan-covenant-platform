# Runs the three test gates and builds the Docker images on every push and pull request.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests, integration tests and coverage
        run: mvn -B -P no-owasp clean verify
      - name: SpotBugs
        run: mvn -B -P no-owasp compile spotbugs:check

  dps:
    name: DPS (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests and coverage
        run: pytest

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Type check and build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [core, dps, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Check compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
      - name: Build images (the heavy worker image is skipped: 4 GB, built on release only)
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build core dps-api ui
