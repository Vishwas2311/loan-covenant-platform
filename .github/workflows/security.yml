# Dependency and image vulnerability scans: on every push and pull request, and weekly so a new CVE in an
# unchanged dependency is still caught. Fails on HIGH or CRITICAL findings that have a fix.
name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: UI dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-fund
      - name: Audit
        run: npm audit --audit-level=high

  python:
    name: DPS dependencies (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dps/pyproject.toml
      - run: pip install -e . pip-audit
      # chromadb comes with crewai and is never imported by DPS (no crew memory or knowledge sources);
      # these advisories have no fixed release yet. Drop the ignores when crewai moves to a fixed chromadb.
      - name: Audit
        run: >-
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  images:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env build core dps-api ui
      # The Core image holds every Java dependency jar, so this also covers the Maven dependencies.
      - name: Scan Core
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: covenant-platform-core
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Scan DPS
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: covenant-platform-dps-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Scan UI
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: covenant-platform-ui
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
