[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-dps"
version = "0.1.0"
description = "Document Processing Service: agreements and statements to covenant proposals and values for Covenant Core"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "python-multipart==0.0.31",
  "pydantic==2.12.*",
  "pydantic-settings>=2.14.2,<3",
  "SQLAlchemy==2.0.*",
  "alembic==1.17.*",
  "PyJWT[crypto]>=2.15,<3",
  "httpx==0.28.*",
  "pypdf==6.21.4",
  "openpyxl==3.1.*",
]

[project.optional-dependencies]
# Background workers (dps-worker): CrewAI Flows A/B and the fast OCR path. The API image does not need these.
worker = [
  # azure-ai-inference: Azure OpenAI for advisory AI (DPS_AI_MODEL=azure/<deployment>).
  "crewai[azure-ai-inference]==1.15.34",
  "rapidocr-onnxruntime==1.4.*",
  # .xls statements (FR-01); openpyxl reads only .xlsx.
  "xlrd==2.0.*",
  "pypdfium2>=4.30",
  "pdfplumber==0.11.*",
]
# dps-worker-heavy only: layout-aware Docling fallback (03-flows-design.md section 8).
heavy = ["docling>=2.0"]
dev = [
  "covenant-dps[worker]",
  "pytest==9.0.*",
  "pytest-cov==7.0.*",
  "ruff==0.14.*",
  "bandit==1.8.*",
  "xlwt==1.3.*",  # writes .xls files for the tests
]
# Production SQL Server driver (needs the Microsoft ODBC driver on the host).
# SQL Server for production: DPS_DATABASE_URL=mssql+pymssql://user:password@host:1433/dps
mssql = ["pymssql==2.3.*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dps --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]  # Alembic-generated

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]  # asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test tokens are not secrets
